[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fe2_rom"
version = "0.1.0"
description = "Reduced-order FE² for hyperelastic materials in DOLFINx — POD + ECM hyper-reduction on periodic RVEs, with full-order buckling and homogenization solvers."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Theron Guo" }]

[tool.setuptools]
packages = ["fe2_rom", "fe2_rom.hyperelastic_solver", "fe2_rom.rom", "fe2_rom.ch1", "fe2_rom.mm"]
