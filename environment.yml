name: fe2_rom_env
channels:
  - conda-forge
dependencies:
  - python=3.14.4
  - fenics-dolfinx=0.10.0
  - dolfinx_mpc=0.10.5
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - pip

  - pip:
    - scipy==1.17.1
    - tqdm==4.67.3
    - meshio==5.3.5
    - scikit-learn==1.8.0
    - jax==0.10.0
    - jaxmat==0.0.3
    # NN surrogate (fe2_rom.nn): CPU-only torch — the extra index makes pip
    # prefer the +cpu wheel on Linux; on macOS it resolves the plain wheel.
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.12.0
    - lightning==2.6.5
    - tensorboard==2.20.0